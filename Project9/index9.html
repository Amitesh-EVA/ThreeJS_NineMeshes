<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Drawing</title>
    <link rel="stylesheet" href="style9.css">
</head>

<body>

    <div id="profileForm">
    <input id="nameInput" placeholder="Your name">
    <input id="empInput" placeholder="Employee Id">
    <input id="designationInput" placeholder="Designation">
    </div>

    <div id="rightInfo">

        <div id ='field' class="designName">
            <label>Design Name:</label>
            <textarea></textarea>
        </div>

        <div id ='field' class="orgName">
            <label>Org name:</label>
            <textarea></textarea>
        </div>

        <div id ='field' class="projectId">
            <label>Project Id:</label>
            <textarea></textarea>
        </div>

        <div id ='field' class="description">
            <label>Description:</label>
            <textarea>Lorem ipsum dolor sit, amet consectetur
                adipisicing elit. Ea, quasi.</textarea>
        </div>

        <div id ='field' class="designDetails">
            <label>Design Details:</label>
            <textarea></textarea>
        </div>

        <div id ='field' class="date">
            <label>Date:</label>
            <input type="text">
        </div>

        <div id ='field' class="hardware">
            <label>Hardware details:</label>
            <textarea></textarea>
        </div>

        <div id ='field' class="developer">
            <label>Developer Name:</label>
            <textarea> </textarea>
        </div>

        <div id ='field' class="dimensions">
            <label>Design dimensions:</label>
            <textarea> </textarea>
        </div>

        <div id ='field' class="scale">
            <label>Scale factor:</label>
            <textarea> </textarea>
        </div>

        <div id ='field' class="signature">
            <label>Signature:</label>
            <textarea> </textarea>
        </div>

    </div>
    
    <script type="module" src="project9.js"></script>
</body>
</html>
